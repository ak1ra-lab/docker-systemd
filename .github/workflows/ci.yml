---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly rebuild so upstream security updates reach the images even when
    # this repository does not change.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs, but let publishes and scheduled
  # rebuilds finish: they update registry tags and must not be interrupted.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Generate image matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ steps.generate.outputs.build }}
      publish: ${{ steps.generate.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install "PyYAML==6.0.3"
      - name: Generate CI matrices from matrix.yaml
        id: generate
        run: |
          {
            echo "build<<__MATRIX__"
            python3 hack/matrix.py --format github-build
            echo "__MATRIX__"
          } >> "$GITHUB_OUTPUT"
          {
            echo "publish<<__MATRIX__"
            python3 hack/matrix.py --format github-publish
            echo "__MATRIX__"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 \
            -o "${RUNNER_TEMP}/shfmt"
          echo "27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0  ${RUNNER_TEMP}/shfmt" \
            | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/shfmt" /usr/local/bin/shfmt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r molecule/systemd/requirements.yml
      - name: Run linters
        run: PYTHON=python hack/lint.sh
      - name: Lint Dockerfiles with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true

  build-smoke:
    name: ${{ matrix.distro }}:${{ matrix.version }} (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.build) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install Ansible
        run: |
          pip install "ansible-core==2.21.4"
          ansible-galaxy collection install community.docker containers.podman
      - name: Runtime smoke test
        env:
          IMAGE: ${{ matrix.image }}
        run: hack/smoke-test.sh --runtime docker "$IMAGE"

  molecule:
    name: Molecule integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build every image with rootful Podman
        run: sudo env "PATH=${PATH}" hack/build.sh --all --runtime podman --jobs 4 --pull
      - name: Run the Ansible-native Molecule scenario
        run: sudo env "PATH=${PATH}" hack/molecule-test.sh

  publish:
    name: Publish ${{ matrix.distro }}:${{ matrix.version }}
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    needs:
      - lint
      - matrix
      - build-smoke
      - molecule
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # Required to push image manifests and layers to GHCR.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.publish) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build-time emulation only: the smoke tests themselves run natively on
      # the amd64/arm64 build-smoke jobs.
      - name: Set up QEMU for cross-platform builds
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the multi-architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ matrix.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
          cache-from: |
            type=gha,scope=${{ matrix.distro }}-${{ matrix.version }}-amd64
            type=gha,scope=${{ matrix.distro }}-${{ matrix.version }}-arm64
