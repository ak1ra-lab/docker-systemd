---
- name: Create container instances
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create containers from the inventory
      containers.podman.podman_container:
        name: "{{ item }}"
        hostname: "{{ item }}"
        image: "{{ hostvars[item]['container_image'] }}"
        command: "{{ hostvars[item]['container_command'] | default('/sbin/init') }}"
        systemd: "{{ hostvars[item]['container_systemd'] | default('always') }}"
        state: started
      loop: "{{ groups['molecule'] }}"
      loop_control:
        label: "{{ item }}"
      register: container_results

    - name: Fail when a container did not start
      ansible.builtin.assert:
        that:
          - item.container.State.Running
          - item.container.State.ExitCode == 0
        fail_msg: "container {{ item.container.Name }} failed to start"
      loop: "{{ container_results.results }}"
      loop_control:
        label: "{{ item.container.Name }}"

    # There is no Ansible module for waiting on the systemd manager to finish
    # booting; the official Molecule systemd guide recommends this command.
    - name: Wait for systemd to finish booting
      ansible.builtin.command: systemctl is-system-running --wait # noqa: command-instead-of-module
      register: systemd_state
      changed_when: false
      failed_when: systemd_state.stdout not in ['running', 'degraded']
      until: systemd_state.stdout in ['running', 'degraded']
      retries: 30
      delay: 2
      delegate_to: "{{ item }}"
      loop: "{{ groups['molecule'] }}"
      loop_control:
        label: "{{ item }}"
